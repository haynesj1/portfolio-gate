# Calls the shared merge gate in haynesj1/portfolio-gate. Synced from there by
# portfolio-ops; do not edit in app repos.
#
# Only triggers that run the DEFAULT-BRANCH copy of this file are used
# (pull_request_target, issue_comment, issues, push to the default branch), so a PR cannot change the gate that
# judges it. Reviews are detected through comments: Codex edits its summary
# comment; the Claude reviewer posts a review-verdict comment; the check and the
# ruling (risk:checked tier) post check-verdict and ruling-verdict comments.
name: pr-gate

on:
  pull_request_target:
    # edited: the PR body can carry the linked issue (`Closes #n`) for the agent-safe tier.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  # deleted: removing the comment that carried a verdict must withdraw its pass.
  issue_comment:
    types: [created, edited, deleted]
  # The agent-safe tier depends on the linked issue (open, queued, not pivotal),
  # so changes to it re-evaluate the PRs that implement it.
  # edited: under the pivotal_spec_check trial the issue's body names the spec, so a body
  # edit can withdraw a pass (portfolio-gate#31).
  issues:
    types: [closed, reopened, labeled, unlabeled, edited]
  # A change to .ops.yml on the default branch (the agent-safe policy) re-evaluates
  # every open PR, so tightening the policy withdraws earlier passes. So does a change
  # under specs/ there: the pivotal_spec_check trial reads a spec's status from the
  # default branch, and a spec that stops being approved must withdraw a pass.
  push:
    branches: [main, master]
    paths: ['.ops.yml', 'specs/**']

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  evaluate:
    # Comments only matter to the gate when they carry a review result: a Codex
    # review summary (any state), a Claude review-verdict, a check-verdict or a
    # ruling-verdict. Other comments
    # (replies, PR summaries, triage notes) are skipped, and a skipped job uses no
    # Actions minutes. Codex summaries always evaluate, whatever their status or
    # JSON spacing: the gate's own parser decides what they mean, so this filter
    # can never hide a review result. PR events (opened, push, ready, draft)
    # always evaluate, with two exceptions. A label change is skipped unless the
    # label is one the gate reads or writes (human-approved, review:override,
    # review:blocking, type:dead-code, risk:low, risk:agent, risk:checked,
    # risk:normal); adding
    # and removing are treated alike, and an event with no label name evaluates.
    # A PR edit is skipped only when it changed the title and nothing else (no
    # body, no base branch) and the author is not Dependabot, whose title the gate
    # reads. Any other edit evaluates, including a body edit from an empty body.
    # An edit that removes a review result also evaluates (the previous
    # body is checked too), and so does deleting a comment that carried one
    # (a deleted event's payload still holds the comment body), so withdrawn
    # evidence is recomputed at once.
    # Issue events evaluate only when they can change the agent-safe tier: the
    # issue closed or reopened, or its ready / in-progress / pivotal label changed,
    # or its body was edited and names a spec before or after the edit (the
    # pivotal_spec_check trial reads the spec the body names). Title-only edits and
    # edits of issues that name no spec are skipped.
    # Tested in gate/workflow.test.js ("caller comment filter" and "caller PR filter").
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'issues' &&
       github.event_name != 'pull_request_target') ||
      (github.event_name == 'pull_request_target' &&
       !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
          github.event.label.name &&
          github.event.label.name != 'human-approved' && github.event.label.name != 'review:override' &&
          github.event.label.name != 'review:blocking' && github.event.label.name != 'type:dead-code' &&
          github.event.label.name != 'risk:low' && github.event.label.name != 'risk:agent' &&
          github.event.label.name != 'risk:checked' && github.event.label.name != 'risk:normal') ||
         (github.event.action == 'edited' && github.event.changes.title &&
          !github.event.changes.body && !github.event.changes.base &&
          github.event.pull_request.user.login &&
          github.event.pull_request.user.login != 'dependabot[bot]'))) ||
      (github.event_name == 'issues' && !github.event.issue.pull_request &&
       (github.event.action == 'closed' || github.event.action == 'reopened' ||
        github.event.label.name == 'ready' || github.event.label.name == 'in-progress' ||
        github.event.label.name == 'pivotal' ||
        (github.event.action == 'edited' && github.event.changes.body &&
         (contains(github.event.issue.body, 'specs/') || contains(github.event.changes.body.from, 'specs/'))))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'review-verdict:v1') ||
        contains(github.event.comment.body, 'codex-review-state:v1') ||
        contains(github.event.comment.body, 'check-verdict:v1') ||
        contains(github.event.comment.body, 'ruling-verdict:v1') ||
        contains(github.event.changes.body.from, 'review-verdict:v1') ||
        contains(github.event.changes.body.from, 'codex-review-state:v1') ||
        contains(github.event.changes.body.from, 'check-verdict:v1') ||
        contains(github.event.changes.body.from, 'ruling-verdict:v1')))
    # One evaluation per PR at a time; a newer one cancels an older one. Set on the
    # job, not the workflow, so a skipped comment run never cancels a real one.
    concurrency:
      group: pr-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    uses: haynesj1/portfolio-gate/.github/workflows/gate.yml@main
    # The repo variable GATE_RUNNER set to `gate-mac` runs the evaluation on the owner's
    # self-hosted runner, which uses no Actions minutes. Unset (or any other value), it
    # runs on GitHub's runner. Delete the variable to go back at once.
    with:
      runner: ${{ vars.GATE_RUNNER || 'ubuntu-24.04' }}
