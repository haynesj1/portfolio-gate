# Calls the shared merge gate in haynesj1/portfolio-gate. Synced from there by
# portfolio-ops; do not edit in app repos.
#
# Only triggers that run the DEFAULT-BRANCH copy of this file are used
# (pull_request_target, issue_comment), so a PR cannot change the gate that
# judges it. Reviews are detected through comments: Codex edits its summary
# comment; the Claude reviewer posts a review-verdict comment.
name: pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  evaluate:
    # Comments only matter to the gate when they carry a review result: a Codex
    # review summary or a Claude review-verdict. Other comments (replies, PR
    # summaries, triage notes) are skipped, and a skipped job uses no Actions
    # minutes. Codex summaries are skipped only while plainly still running, in
    # either JSON spacing; any other status (completed, succeeded, success, or a
    # format we don't recognise) evaluates, so the filter can only fail towards an
    # extra run, never a missed one. PR events (push, labels, ready) always evaluate.
    # Tested in gate/workflow.test.js ("caller comment filter").
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'review-verdict:v1') ||
        (contains(github.event.comment.body, 'codex-review-state:v1') &&
         !contains(github.event.comment.body, '"status":"running"') &&
         !contains(github.event.comment.body, '"status": "running"'))))
    # One evaluation per PR at a time; a newer one cancels an older one. Set on the
    # job, not the workflow, so a skipped comment run never cancels a real one.
    concurrency:
      group: pr-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    uses: haynesj1/portfolio-gate/.github/workflows/gate.yml@main
